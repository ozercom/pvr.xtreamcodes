name: Build Xtream channel browser
on:
  workflow_dispatch:
  push:
    branches:
      - feature/global-channel-search-and-group-navigation
    paths:
      - 'plugin.video.xtreamcodes.browser/**'
      - '.github/workflows/build-channel-browser.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile plugin.video.xtreamcodes.browser/default.py
      - name: Package Kodi script add-on
        run: |
          rm -f plugin.video.xtreamcodes.browser-0.1.0.zip
          zip -r plugin.video.xtreamcodes.browser-0.1.0.zip plugin.video.xtreamcodes.browser
          unzip -t plugin.video.xtreamcodes.browser-0.1.0.zip
          unzip -l plugin.video.xtreamcodes.browser-0.1.0.zip | grep -q 'plugin.video.xtreamcodes.browser/addon.xml'
          unzip -l plugin.video.xtreamcodes.browser-0.1.0.zip | grep -q 'plugin.video.xtreamcodes.browser/default.py'
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plugin.video.xtreamcodes.browser-0.1.0
          path: plugin.video.xtreamcodes.browser-0.1.0.zip
          if-no-files-found: error
