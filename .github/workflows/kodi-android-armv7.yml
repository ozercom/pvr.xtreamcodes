name: Build Xtream Codes Kodi 21.2 Android ARMv7 ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - kodi-21.2-no-epg-scan-fix

permissions:
  contents: read

jobs:
  build-addon:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Xtream Codes addon
        uses: actions/checkout@v4
        with:
          ref: kodi-21.2-no-epg-scan-fix

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git unzip zip

      - name: Fetch Kodi 21.2 addon SDK
        run: |
          git clone --depth 1 --branch 21.2-Omega https://github.com/xbmc/xbmc.git "$HOME/kodi"
          test -f "$HOME/kodi/xbmc/addons/kodi-dev-kit/include/kodi/addon-instance/PVR.h"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build Android ARMv7 addon and installable ZIP
        env:
          VERSION: 1.1.9
          PLATFORM_SUFFIX: android-armeabi-v7a
        run: |
          set -euo pipefail
          # Expand HOME in the shell. GitHub Actions env values do not expand $HOME.
          export KODI_ADDON_SDK="$HOME/kodi/xbmc/addons/kodi-dev-kit"
          export CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21"
          ./build.sh --version "$VERSION"
          test -s dist/pvr.xtreamcodes-1.1.9-android-armeabi-v7a.zip
          unzip -l dist/pvr.xtreamcodes-1.1.9-android-armeabi-v7a.zip
          unzip -p dist/pvr.xtreamcodes-1.1.9-android-armeabi-v7a.zip pvr.xtreamcodes/addon.xml | grep 'version="1.1.9"'

      - name: Upload Kodi installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pvr.xtreamcodes-1.1.9-android-armeabi-v7a
          path: dist/pvr.xtreamcodes-1.1.9-android-armeabi-v7a.zip
          if-no-files-found: error
          retention-days: 14
