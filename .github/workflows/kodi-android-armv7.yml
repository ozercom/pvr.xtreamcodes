name: Kodi 21.2 Android ARMv7 with bundled Xtream Codes

on:
  workflow_dispatch:
  push:
    branches:
      - kodi-21.2-no-epg-scan-fix

permissions:
  contents: read

jobs:
  build-addon-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Xtream Codes addon
        uses: actions/checkout@v4
        with:
          ref: kodi-21.2-no-epg-scan-fix

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl git unzip zip

      - name: Set up Java for APK signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;21.4.7075529"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Fetch only Kodi 21.2 addon SDK headers
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch 21.2-Omega https://github.com/xbmc/xbmc.git "$HOME/kodi-sdk"
          git -C "$HOME/kodi-sdk" sparse-checkout set xbmc/addons/kodi-dev-kit
          test -f "$HOME/kodi-sdk/xbmc/addons/kodi-dev-kit/include/kodi/addon-instance/PVR.h"

      - name: Build Xtream Codes 1.1.7 for Android ARMv7
        env:
          KODI_ADDON_SDK: ${{ github.workspace }}/../kodi-sdk/xbmc/addons/kodi-dev-kit
          CMAKE_EXTRA_ARGS: -DCMAKE_TOOLCHAIN_FILE=/home/runner/Android/Sdk/ndk/21.4.7075529/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_shared
        run: |
          export KODI_ADDON_SDK="$HOME/kodi-sdk/xbmc/addons/kodi-dev-kit"
          export CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_shared"
          PLATFORM_SUFFIX=android-armeabi-v7a ./build.sh --skip-zip
          test -s dist/pvr.xtreamcodes/pvr.xtreamcodes.android.so
          grep -q 'version="1.1.8"' dist/pvr.xtreamcodes/addon.xml

      - name: Download official Kodi 21.2 ARMv7 APK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://mirrors.kodi.tv/releases/android/arm/kodi-21.2-Omega-armeabi-v7a.apk?https=1" \
            --output "$RUNNER_TEMP/kodi-base.apk"
          unzip -Z1 "$RUNNER_TEMP/kodi-base.apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -q '^assets/addons/' "$RUNNER_TEMP/apk-files.txt"
          grep -q '^lib/armeabi-v7a/libc++_shared.so$' "$RUNNER_TEMP/apk-files.txt"

      - name: Bundle addon into Kodi APK and sign
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/kodi-apk"
          mkdir -p "$WORK"
          unzip -q "$RUNNER_TEMP/kodi-base.apk" -d "$WORK"

          mkdir -p "$WORK/assets/addons/pvr.xtreamcodes" "$WORK/lib/armeabi-v7a"
          cp -a dist/pvr.xtreamcodes/. "$WORK/assets/addons/pvr.xtreamcodes/"
          install -m 755 dist/pvr.xtreamcodes/pvr.xtreamcodes.android.so \
            "$WORK/lib/armeabi-v7a/libpvr.xtreamcodes.android.so"

          # Remove the original APK's v1 signature before rebuilding the archive.
          rm -rf "$WORK/META-INF"
          mkdir -p out
          (cd "$WORK" && zip -q -r "$RUNNER_TEMP/Kodi-21.2-Ozer-ARMv7-unsigned.apk" .)
          zipalign -f -p 4 "$RUNNER_TEMP/Kodi-21.2-Ozer-ARMv7-unsigned.apk" \
            "$RUNNER_TEMP/Kodi-21.2-Ozer-ARMv7-aligned.apk"

          keytool -genkeypair -keystore "$RUNNER_TEMP/ozer-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Ozer Kodi Build,O=Ozer,C=TR" -keyalg RSA -keysize 2048 -validity 10000

          apksigner sign --ks "$RUNNER_TEMP/ozer-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out out/Kodi-21.2-Ozer-ARMv7.apk \
            "$RUNNER_TEMP/Kodi-21.2-Ozer-ARMv7-aligned.apk"
          apksigner verify --verbose out/Kodi-21.2-Ozer-ARMv7.apk

          unzip -Z1 out/Kodi-21.2-Ozer-ARMv7.apk | grep -q '^assets/addons/pvr.xtreamcodes/addon.xml$'
          unzip -Z1 out/Kodi-21.2-Ozer-ARMv7.apk | grep -q '^lib/armeabi-v7a/libpvr.xtreamcodes.android.so$'

          (cd dist && zip -qr "$GITHUB_WORKSPACE/out/pvr.xtreamcodes-1.1.8-android-armeabi-v7a.zip" pvr.xtreamcodes)

      - name: Upload APK and addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-21.2-Ozer-ARMv7
          path: |
            out/Kodi-21.2-Ozer-ARMv7.apk
            out/pvr.xtreamcodes-1.1.7-android-armeabi-v7a.zip
          if-no-files-found: error
          retention-days: 14
